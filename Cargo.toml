[package]
name = "gitkeep"
version = "0.3.1"
description = "High-performance GitHub archival tool"
edition = "2024"
license = "MIT"
repository = "https://github.com/trypsynth/gitkeep"
keywords = ["github", "archive", "git", "sync"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.91.1"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
crossterm = "0.29.0"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
octocrab = { version = "0.54.5", default-features = false, features = ["default-client", "rustls", "rustls-ring", "retry", "timeout"] }
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt", "macros"] }
toml = "1.1.8"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
